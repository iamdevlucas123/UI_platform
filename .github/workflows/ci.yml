name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      db_test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uilib
          POSTGRES_PASSWORD: uilib
          POSTGRES_DB: uilib_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U uilib -d uilib_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://uilib:uilib@localhost:5433/uilib_test?schema=public
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:3000
      PORT: '4000'
      LOG_LEVEL: error
      DEV_ADMIN_TOKEN: ci-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @uilib/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
